# Activa o pausa el correo de intake (docs/correos-intake.md) sin tocar la imagen.
# Se ejecuta a mano: Actions → Correos de intake → Run workflow.
# Pausar conserva los correos pendientes; se envían al volver a activar.
name: Correos de intake

on:
  workflow_dispatch:
    inputs:
      activo:
        description: "1 envía los correos, 0 los pausa"
        type: choice
        options: ["1", "0"]
        default: "1"

permissions:
  contents: read

jobs:
  configurar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: produccion
      url: https://nexo-portafolio-ia.wittysea-7e111699.eastus.azurecontainerapps.io
    concurrency:
      group: nexo-portafolio-ia-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: rg-nexo-ai-core
      APP_NAME: nexo-portafolio-ia
    steps:
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Set email variables
        env:
          ACTIVO: ${{ inputs.activo }}
        run: |
          # One replica stays up so queued emails go out even when nobody has the site open.
          az containerapp update -g "$RESOURCE_GROUP" -n "$APP_NAME" --only-show-errors --output none \
            --set-env-vars NEXO_CORREO_REMITENTE=alexandra.paiz@grupopdc.com "NEXO_CORREO_ACTIVO=$ACTIVO" \
            --min-replicas 1
      - name: Wait for healthy revision
        run: |
          for i in $(seq 1 60); do
            latest=$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP_NAME" --query properties.latestRevisionName -o tsv)
            ready=$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP_NAME" --query properties.latestReadyRevisionName -o tsv)
            if [ -n "$latest" ] && [ "$latest" = "$ready" ]; then
              state=$(az containerapp revision show -g "$RESOURCE_GROUP" -n "$APP_NAME" --revision "$latest" \
                --query 'properties.healthState' -o tsv)
              echo "$latest: $state"
              [ "$state" = Healthy ] && { echo "Revision $latest healthy with NEXO_CORREO_ACTIVO=${{ inputs.activo }}" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
            else
              echo "Waiting: latest=$latest ready=$ready"
            fi
            sleep 10
          done
          echo 'Revision not healthy within ten minutes; check the container logs' >&2
          exit 1
