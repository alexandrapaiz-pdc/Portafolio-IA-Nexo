# Despliegue automático, como Vercel: cada cambio en main se prueba, se construye
# y se publica en Azure Container Apps. Sin contraseñas: GitHub entra a Azure con
# OIDC (identidad federada) y solo puede actualizar esta app.
#
# Variables del repositorio (Settings → Secrets and variables → Actions → Variables);
# son identificadores, no secretos:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID   identidad de despliegue
#   ACR_NAME, RESOURCE_GROUP, APP_NAME                        a dónde se despliega
name: Desplegar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          # test_conexion_con_token_de_entra connects with a fake Entra token as the password;
          # this throwaway database only exists inside the run, so it accepts any password.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s ../.github/scripts -v
      - run: python -m pytest -q tests
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres

  desplegar:
    needs: pruebas
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: produccion
      url: https://nexo-portafolio-ia.wittysea-7e111699.eastus.azurecontainerapps.io
    concurrency:
      group: nexo-portafolio-ia-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: rg-nexo-ai-core
      APP_NAME: nexo-portafolio-ia
      ACR_NAME: crnexoaipdc01
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Skip superseded commits
        id: current
        shell: bash
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipped: a newer main commit is available.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        if: steps.current.outputs.current == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Registry authentication and build timestamp
        if: steps.current.outputs.current == 'true'
        run: |
          az acr login --name "$ACR_NAME" --only-show-errors
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          az config set extension.use_dynamic_install=yes_without_prompt
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.current.outputs.current == 'true'
      - name: Build once and push exact image
        if: steps.current.outputs.current == 'true'
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: crnexoaipdc01.azurecr.io/nexo-portafolio-ia:${{ github.sha }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_TIME=${{ env.BUILD_TIME }}
          cache-from: type=gha,scope=nexo-portafolio-ia
          cache-to: type=gha,mode=max,scope=nexo-portafolio-ia
      - name: Deploy and wait for healthy revision
        if: steps.current.outputs.current == 'true'
        env:
          DEPLOY_IMAGE: crnexoaipdc01.azurecr.io/nexo-portafolio-ia@${{ steps.build.outputs.digest }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" != "$GITHUB_SHA" ]; then
            echo 'Skipped deployment: a newer main commit arrived during build.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python .github/scripts/deploy_portal.py
      - name: Verify anonymous API remains protected
        if: steps.current.outputs.current == 'true'
        run: |
          code=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' https://nexo-portafolio-ia.wittysea-7e111699.eastus.azurecontainerapps.io/api/version)
          test "$code" = 401 || test "$code" = 403 || test "$code" = 302
      - name: Save deployment receipt
        if: always() && steps.current.outputs.current == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-${{ github.sha }}-${{ github.run_attempt }}
          path: deployment.json
          if-no-files-found: ignore
